name: skip-foundation
on:
  push:
    branches: [ main ]
    tags: "[0-9]+.[0-9]+.[0-9]+"
  schedule:
    - cron:  '0 12 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  call-workflow:
    uses: skiptools/actions/.github/workflows/skip-framework.yml@v1
    with:
      # arm macOS can't host the Android emulator, so skip-framework.yml runs the
      # emulator tests only on the x86_64 Ubuntu leg
      runs-on: "['macos-26', 'ubuntu-24.04']"
